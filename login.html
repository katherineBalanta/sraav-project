<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRAAV - Login Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="login-card-container animate-fade">
            <div class="row g-0">
                <div class="col-md-6 d-flex align-items-center justify-content-center bg-black-side">
                    <div class="logo-wrapper">
                        <img src="assets/img/logo automatizacion.png" alt="SRAAV Logo" class="img-fluid main-logo">
                    </div>
                </div>

                <div class="col-md-6 bg-blue-side p-5 text-center">
                    <div class="user-icon-container mb-3">
                        <div class="user-icon-circle">
                            <i class="fa-regular fa-user"></i>
                        </div>
                    </div>
                    
                    <h2 class="login-title mb-4">Inicio de sesión</h2>
                    
                    <form action="dashboard.html">
                        <div class="mb-3 text-start">
                            <label class="form-label label-login">Usuario o correo electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                                <input type="text" class="form-control input-login" placeholder="ejemplo@gmail.com">
                            </div>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label label-login">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control input-login" placeholder="*************">
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-login-green">Iniciar sesión</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
