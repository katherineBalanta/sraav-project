<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRAAV - Control en Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div>
                <div class="text-center mb-4"><div class="bg-secondary rounded-circle mx-auto mb-2" style="width:60px; height:60px;"></div><h6 class="text-white mb-0">Katherine Balanta</h6></div>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="biblioteca.html"><i class="fa-solid fa-compact-disc"></i>Biblioteca</a></li>
                    <li class="nav-item"><a href="programacion.html"><i class="fa-solid fa-calendar-days"></i>Programación</a></li>
                    <li class="nav-item active"><a href="control.html"><i class="fa-solid fa-tower-broadcast"></i>Control en vivo</a></li>
                    <li class="nav-item"><a href="perfil.html"><i class="fa-solid fa-clock-rotate-left"></i>Historial</a></li>
                </ul>
            </div>
            <a href="index.html" class="btn btn-outline-danger rounded-pill btn-sm">Salir</a>
        </aside>

        <main class="main-content animate-fade">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Playlist Evento Mañana</h4>
                <button class="btn btn-green"><i class="fa-regular fa-floppy-disk me-2"></i>Guardar</button>
            </div>

            <div class="row g-4">
                <div class="col-md-5">
                    <div class="glass-card p-3" style="min-height: 450px;">
                        <h6 class="fw-semibold mb-3 border-bottom border-secondary pb-2">Biblioteca</h6>
                        <div class="row g-2">
                            <div class="col-6"><div class="p-4 bg-secondary bg-opacity-25 rounded text-center"><i class="fa-solid fa-music fa-lg mb-2"></i><div class="small">Track 1</div></div></div>
                            <div class="col-6"><div class="p-4 bg-secondary bg-opacity-25 rounded text-center"><i class="fa-solid fa-music fa-lg mb-2"></i><div class="small">Track 2</div></div></div>
                            <div class="col-6"><div class="p-4 bg-secondary bg-opacity-25 rounded text-center"><i class="fa-solid fa-video fa-lg mb-2"></i><div class="small">Video 1</div></div></div>
                            <div class="col-6"><div class="p-4 bg-secondary bg-opacity-25 rounded text-center"><i class="fa-solid fa-video fa-lg mb-2"></i><div class="small">Video 2</div></div></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="glass-card p-3" style="min-height: 450px;">
                        <h6 class="fw-semibold mb-3 border-bottom border-secondary pb-2">Playlist Actual</h6>
                        
                        <div class="vstack gap-2">
                            <div class="p-3 rounded d-flex justify-content-between align-items-center" style="background: rgba(255,255,255,0.04); border-left: 3px solid var(--primary-blue);">
                                <div class="d-flex align-items-center">
                                    <i class="fa-solid fa-circle-play text-success me-3"></i>
                                    <div>
                                        <span class="d-block small fw-medium">intro_evento.mp4</span>
                                        <span class="text-muted extra-small" style="font-size: 11px;">01:10</span>
                                    </div>
                                </div>
                                <div class="btn-group btn-group-sm">
                                    <button class="btn btn-outline-light border-0"><i class="fa-solid fa-arrow-up"></i></button>
                                    <button class="btn btn-outline-danger border-0"><i class="fa-regular fa-trash-can"></i></button>
                                </div>
                            </div>

                            <div class="p-3 rounded d-flex justify-content-between align-items-center" style="background: rgba(255,255,255,0.04); border-left: 3px solid var(--primary-blue);">
                                <div class="d-flex align-items-center">
                                    <i class="fa-solid fa-pause text-warning me-3"></i>
                                    <div>
                                        <span class="d-block small fw-medium">cancion_entrada.mp3</span>
                                        <span class="text-muted extra-small" style="font-size: 11px;">02:34</span>
                                    </div>
                                </div>
                                <div class="btn-group btn-group-sm">
                                    <button class="btn btn-outline-light border-0"><i class="fa-solid fa-arrow-up"></i></button>
                                    <button class="btn btn-outline-danger border-0"><i class="fa-regular fa-trash-can"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
